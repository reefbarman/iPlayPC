name: iPlayNow
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # The vendored native libraries only have arm64 simulator slices
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    # Release builds can override these from a git tag
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  iPlayNow:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - target: NVSTKit
    # Signing team and bundle ID live in Config/Local.xcconfig (see Config/Signing.xcconfig)
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IPLAYNOW_BUNDLE_ID)
        # iPhone and iPad
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MTL_FAST_MATH: YES
        # NVSTKit's module imports OpenSSL, whose headers include <openssl/...>
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(BUILT_PRODUCTS_DIR)/OpenSSL.framework/Headers
          - $(BUILT_PRODUCTS_DIR)/XCFrameworkIntermediates/OpenSSL/OpenSSL.framework/Headers
        OTHER_CFLAGS:
          - $(inherited)
          - -Wno-incomplete-umbrella
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: iPlayNow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.games
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad allows every orientation, which also lets it run in Split View and Stage Manager
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: false
        UIViewControllerBasedStatusBarAppearance: true
        # Lets ProMotion run above 60 Hz
        CADisableMinimumFrameDurationOnPhone: true
        # NVIDIA's sign-in redirects to http://localhost:2259, which the app catches
        NSLocalNetworkUsageDescription: iPlayNow uses a local address to finish signing in to GeForce NOW.
        # Game controllers can drive the UI and Game Mode kicks in while streaming
        GCSupportsControllerUserInteraction: true
        GCSupportsGameMode: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: DualSense
        CFBundleURLTypes:
          - CFBundleURLName: dev.reefbarman.iplaynow.signin
            CFBundleURLSchemes:
              - iplaynow
  # GeForce NOW's native NVST streaming protocol, from OpenNOW (MIT). See NVSTKit/README.md.
  NVSTKit:
    type: framework
    platform: iOS
    sources:
      - path: NVSTKit/Sources
        excludes:
          - "**/*.md"
          - "**/*.json"
          - "**/LICENSE"
          - "**/Licenses/**"
    dependencies:
      # Extracted from Vendor/ by scripts/prepare-frameworks.sh
      - framework: Frameworks/OpenSSL.xcframework
        embed: false
      - framework: Frameworks/usrsctp.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reefbarman.iplaynow.nvstkit
        MACH_O_TYPE: staticlib
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(BUILT_PRODUCTS_DIR)/OpenSSL.framework/Headers
          - $(BUILT_PRODUCTS_DIR)/XCFrameworkIntermediates/OpenSSL/OpenSSL.framework/Headers
        OTHER_CFLAGS:
          - $(inherited)
          - -Wno-incomplete-umbrella
