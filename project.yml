name: iPlayPC
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # IHSKit's simulator slice is arm64 only (Apple silicon Macs)
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    # Release builds override these from the git tag (scripts/package-ipa.sh)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  iPlayPC:
    type: application
    platform: iOS
    sources:
      - path: App
        # Temporary (build plan step 2): the player and settings copied from iPlayNow
        # aren't adapted yet, so they stay out of the build until step 3.
        excludes:
          - "Streaming/**"
          - "Models/Models.swift"
          - "Models/ControllerStyle.swift"
          - "Models/PhoneStatus.swift"
          - "Views/ConsoleListView.swift"
          - "Views/AddConsoleView.swift"
          - "Views/ControllerScene.swift"
          - "Views/ControllerSceneView.swift"
          - "Views/ControllerTestView.swift"
          - "Views/GamepadForm.swift"
          - "Views/SettingsView.swift"
          - "Views/StreamKeyboard.swift"
          - "Views/StreamView.swift"
          - "Views/VirtualControlsOverlay.swift"
    dependencies:
      # Built by scripts/build-ihskit.sh: ihslib (patched) + mbedTLS + Opus + protobuf-c, and the ihs_bridge C API
      - framework: Frameworks/IHSKit.xcframework
        embed: false
    # Signing team and bundle ID live in Config/Local.xcconfig (see Config/Signing.xcconfig)
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IPLAYPC_BUNDLE_ID)
        # iPhone and iPad
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MTL_FAST_MATH: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: iPlayPC
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.games
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad allows every orientation, which also lets it run in Split View and Stage Manager
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: false
        UIViewControllerBasedStatusBarAppearance: true
        # Lets ProMotion run above 60 Hz
        CADisableMinimumFrameDurationOnPhone: true
        NSLocalNetworkUsageDescription: iPlayPC finds and connects to PCs running Steam on your local network.
        NSMicrophoneUsageDescription: iPlayPC sends your voice to your PC for voice chat when Microphone is on in settings.
        # Game controllers can drive the UI and Game Mode kicks in while streaming
        GCSupportsControllerUserInteraction: true
        GCSupportsGameMode: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: DualSense
